name = "tunisgo-live"
main = "src/index.js"
compatibility_date = "2025-06-01"

[triggers]
crons = ["* * * * *"]

# Latest live.json (free plan: SQLite-backed Durable Objects, no R2 needed).
[[durable_objects.bindings]]
name = "LIVE_STORE"
class_name = "LiveStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveStore"]

# Timetable databases for in-app updates: public/db/manifest.json and the
# versioned .db files, generated by `npm run deploy` (scripts/prepare-db.mjs).
[assets]
directory = "./public"

[observability]
enabled = true
