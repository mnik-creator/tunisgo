name: tunis_go
description: "Tunis GO - Unofficial SNCFT train schedule app for Tunisia."
publish_to: 'none'

version: 2.1.0+8

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^0.4.5+2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  dio: ^5.7.0
  crypto: ^3.0.5
  flutter_web_auth_2: ^4.0.0
  flutter_secure_storage: ^9.2.4
  purchases_flutter: ^9.15.1
  google_mobile_ads: ^5.1.0
  purchases_ui_flutter: ^9.15.1
  app_links: ^6.4.0
  url_launcher: ^6.3.1
  in_app_review: ^2.0.9
  webview_flutter: ^4.10.0
  flutter_svg: ^2.0.17
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: "assets/images/app_icon_android.png"
  image_path_ios: "assets/images/app_icon_ios.png"
  adaptive_icon_background: "#319349"
  adaptive_icon_foreground: "assets/images/app_icon_android.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/db/sncft.db
    - assets/initial/
    - assets/images/
    - privacy-policy.html
    - terms-of-service.html
    - LICENSE
